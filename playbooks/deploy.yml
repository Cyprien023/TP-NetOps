- name: "Pousser configs"
  hosts: all
  gather_facts: false
  become: true
  become_method: enable
  tasks:
    - name: Pousser config
      arista.eos.eos_config:
        lines: "{{ lookup('file', '/tmp/' + inventory_hostname + '_deploy.cfg') | split('\n') | reject('match', '^\\s*$') | reject('match', '^!') | list }}"